<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>わな猟日誌（京都府）</title>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<style>
:root{
  --bg:#f3f1ea; --card:#fff; --ink:#1d241f; --sub:#5d665f; --line:#d9d6cc;
  --green:#1f3a2b; --green2:#2f5d43; --orange:#c8611d; --red:#b3261e; --blue:#2a5b8a; --yellow:#f2c94c;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 14px calc(10px) 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-width:0}
header h1 .hlogo{width:32px;height:32px;flex:0 0 auto;border-radius:50%}
header h1 .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 起動画面 */
#splash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#2a3a24 0,#0e140f 66%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e9dcbc;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:min(82vw,340px);height:auto;border-radius:50%;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
#splash .t1{font-size:28px;font-weight:900;letter-spacing:.18em;margin-top:22px;color:#fff}
#splash .t2{font-size:12px;letter-spacing:.32em;color:#c9a24a;margin-top:6px}
#splash .t3{font-size:12px;opacity:.7;margin-top:26px}
/* 更新のお知らせ */
#notice{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
#notice.open{display:flex}
#notice .box{background:#fff;border-radius:18px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#notice .top{background:#14241b;color:#fff;padding:18px;display:flex;gap:14px;align-items:center}
#notice .top img{width:64px;height:64px;border-radius:50%}
#notice .top b{font-size:18px;display:block}
#notice .top span{font-size:12px;color:#c9a24a;letter-spacing:.1em}
#notice ul{margin:14px 18px 6px;padding-left:20px;line-height:1.6;font-size:15px}
#notice .btns{display:flex;flex-direction:column;gap:8px;padding:12px 18px 18px}
.manualbtn{display:block;text-align:center;text-decoration:none}
header .me{font-size:13px;opacity:.85}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff}
.badge.warn{background:var(--yellow);color:#3a2a00}
.badge.err{background:#ffd9d6;color:var(--red)}
main{padding:12px 12px 120px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.loc{display:flex;gap:12px;align-items:center}
.mesh{min-width:96px;text-align:center;background:var(--green);color:#fff;border-radius:12px;padding:8px 6px}
.mesh .n{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:.04em}
.mesh .l{font-size:11px;opacity:.85}
.loc .place{flex:1;min-width:0}
.loc .place .p1{font-size:18px;font-weight:700}
.loc .place .p2{font-size:13px;color:var(--sub)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.act{border:0;border-radius:var(--r);padding:16px 10px;font-size:18px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px}
.act small{font-size:12px;font-weight:400;opacity:.9}
.a-set{background:var(--green2)} .a-check{background:var(--blue)} .a-catch{background:var(--orange)} .a-remove{background:#6b6b6b} .a-note{background:#7a5a2f;grid-column:span 2;min-height:56px;flex-direction:row;justify-content:center;gap:10px}
h2{font-size:15px;margin:18px 4px 8px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.trap{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.trap:last-child{border-bottom:0}
.trap .id{font-weight:800;font-size:17px;min-width:76px}
.trap .info{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.trap .info b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;background:#eee;color:#333}
.tag.k{background:#fde7d6;color:#7a3a0c}.tag.h{background:#fff3c4;color:#6a5200}.tag.f{background:#d8f0ea;color:#1d5a4c}
.tag.pending{background:#e6eefc;color:var(--blue)}
.days{font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px;background:#e9f3ec;color:var(--green2);white-space:nowrap}
.days.late{background:#ffe1de;color:var(--red)}
.empty{color:var(--sub);font-size:14px;padding:6px 4px}
.log{font-size:13px;padding:8px 4px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.log .t{color:var(--sub);min-width:84px}
.log.tap{cursor:pointer}.log.tap:active{background:#f0f3f0}
.log .go{margin-left:auto;color:var(--sub);align-self:center}
.tag.cam{white-space:nowrap}
.eph{position:relative;display:inline-block}.eph img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.eph.rm img{opacity:.3}.eph .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:#b3261e;color:#fff;font-weight:800}
.eph.rm .x{background:#555}.eph.rm::after{content:'外す';position:absolute;left:0;right:0;top:32px;text-align:center;font-weight:800;color:#b3261e}
.note-pin{font-size:20px;line-height:26px;width:28px;height:28px;text-align:center;background:#fff3c4;border:2px solid #7a5a2f;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.btn.danger{background:#fff;color:#b3261e;border:1px solid #b3261e}
.preset{background:#fff3c4;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.deer .bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0}
.deer .bar i{display:block;height:100%;background:var(--orange)}
.small{font-size:12px;color:var(--sub)}
.alert{background:#fff6d8;border:1px solid #f0d77a;color:#5a4500;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.alert.red{background:#ffe9e7;border-color:#f3b4ad;color:#7a1a12}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:34;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .2s ease;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet:not(.open){visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
.sheet-bg.open{display:block}
.sheet .hd{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .hd h3{margin:0;font-size:18px;flex:1}
.sheet .bd{padding:12px 16px;max-width:640px;margin:0 auto}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px}
.chip.on{background:var(--green2);border-color:var(--green2);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.stepper{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.stepper button{width:40px;height:44px;border-radius:10px;border:0;background:#eee;font-size:22px}
.stepper span{flex:1;text-align:center;font-size:22px;font-weight:800}
.stepper-l{font-size:13px;color:var(--sub);text-align:center;margin-bottom:4px}
.btn{width:100%;border:0;border-radius:var(--r);padding:16px;font-size:18px;font-weight:800;background:var(--green);color:#fff;margin-top:18px}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:16px;padding:13px}
.btn:disabled{opacity:.5}
.checkrow{display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.checkrow input{width:24px;height:24px}
.checkrow .nm{font-weight:800;min-width:70px}
.checkrow select{font-size:15px;padding:8px;flex:1}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.hint{font-size:13px;background:#eef4ee;border-radius:10px;padding:10px 12px;color:#26412f;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;font-size:15px;display:none;max-width:90vw}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6}
.mini{font-size:12px;color:var(--sub);margin-top:4px}
a{color:var(--blue)}
/* 地図 */
#mapView{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#mapView.open{display:flex}
#mapView .bar{display:flex;gap:6px;align-items:center;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--green);color:#fff;flex-wrap:wrap}
#mapView .bar b{flex:1;font-size:16px}
#mapView .bar button{border:0;border-radius:10px;padding:8px 10px;font-size:13px;background:rgba(255,255,255,.18);color:#fff}
#mapView .bar button.on{background:#fff;color:var(--green);font-weight:700}
#map{flex:1}
.mesh-label{font:700 12px system-ui,sans-serif;color:#1f3a2b;background:rgba(255,255,255,.75);border-radius:4px;padding:0 3px;white-space:nowrap}
.trap-label{font:700 11px system-ui,sans-serif;background:#fff;border:1px solid #333;border-radius:4px;padding:0 3px;white-space:nowrap}
.leaflet-popup-content{font-size:14px;line-height:1.5;margin:10px 12px}
.leaflet-popup-content .pbtn{display:block;width:100%;margin-top:6px;border:0;border-radius:8px;padding:8px;font-size:14px;background:var(--green);color:#fff;text-align:center;text-decoration:none}
.leaflet-popup-content .pbtn.sec{background:#eee;color:#222}
#fixPanel{display:none;position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:1000;background:#fff;border-radius:14px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#fixPanel.open{display:block}
#fixPanel .row{margin-top:8px}
#fixPanel button{border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:700}
#crosshair{display:none;position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:900;pointer-events:none}
#crosshair.open{display:block}
#mapWrap{position:relative;flex:1;display:flex}
/* 写真 */
.pstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.pstrip img{width:76px;height:76px;flex:0 0 auto;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#e8ebe8}
.leaflet-popup-content .pstrip img{width:64px;height:64px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pgrid figure{margin:0}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#e8ebe8;display:block}
.pgrid figcaption{font-size:11px;color:var(--sub);line-height:1.3;margin-top:2px}
.pday{font-weight:700;margin-top:14px}
#viewer{display:none;position:fixed;inset:0;z-index:60;background:#000;flex-direction:column;align-items:center;justify-content:center}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain}
#viewer .cap{color:#fff;font-size:14px;padding:10px;text-align:center}
#viewer .x{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;border:0;border-radius:20px;padding:8px 14px;background:rgba(255,255,255,.2);color:#fff;font-size:15px}
.tag.cam{background:#eef1f6;color:#2a5b8a}
</style>
</head>
<body>
<header>
  <h1><img class="hlogo" src="logo-s.webp" alt=""><span class="ttl">わな猟日誌 <span class="me" id="meName"></span></span></h1>
  <button class="badge" onclick="App.openMap()" aria-label="地図">🗺 地図</button>
  <button class="badge" id="syncBadge" onclick="App.badgeTap()">…</button>
  <button class="badge" onclick="App.openSettings()" aria-label="設定">⚙</button>
</header>
<main id="main"></main>
<div id="splash" onclick="this.classList.add('hide')"><img src="top.webp" alt="TRAP HUNTER MAP"><div class="t1">わな猟日誌</div><div class="t3" id="splashVer"></div></div>
<div id="notice"><div class="box"><div class="top"><img src="logo-s.webp" alt=""><div><span>UPDATE</span><b id="noticeTitle"></b></div></div><ul id="noticeList"></ul><div class="btns"><button class="btn sec" id="noticeManual" onclick="App.openManual()">📖 マニュアル（PDF）を開く</button><button class="btn" onclick="App.closeNotice()">OK</button></div></div></div>
<div class="sheet-bg" id="sheetBg" onclick="App.closeSheet()"></div>
<div class="sheet" id="sheet"><div class="hd"><h3 id="sheetTitle"></h3><button class="iconbtn" onclick="App.closeSheet()">閉じる</button></div><div class="bd" id="sheetBody"></div></div>
<div id="mapView"><div class="bar"><button onclick="App.closeMap()">← 戻る</button><b></b>
  <button id="bStd" class="on" onclick="App.setBase('std')">地図</button><button id="bPhoto" onclick="App.setBase('photo')">写真</button>
  <button id="bGrid" class="on" onclick="App.toggleGrid()">区画</button><button id="bOld" onclick="App.toggleRemoved()">撤去済</button><button id="bNote" class="on" onclick="App.toggleNotes()">📝メモ</button><button onclick="App.mapToMe()">現在地</button></div>
  <div id="mapWrap"><div id="map"></div>
  <svg id="crosshair" viewBox="0 0 44 44"><circle cx="22" cy="22" r="9" fill="none" stroke="#c8611d" stroke-width="3"/><path d="M22 0v13M22 31v13M0 22h13M31 22h13" stroke="#c8611d" stroke-width="3"/></svg>
  <div id="fixPanel"></div></div></div>
<div id="viewer" onclick="App.closeViewer()"><button class="x">閉じる</button><button class="x" style="right:auto;left:10px" onclick="event.stopPropagation();App.saveViewer()">スマホに保存</button><img id="viewerImg" alt=""><div class="cap" id="viewerCap"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">

<script>
'use strict';
// ================= 位置図番号（京都府鳥獣保護区等位置図 令和8年度） =================
// 行=floor(緯度×24)、列=floor(経度×16)。北の行から順に西→東へ001〜242。
const MESH_ROWS=[[858,[62,63,64]],[857,[61,62,63,64,66,67]],[856,[59,60,61,62,63,64,66,67]],[855,[57,58,59,60,61,62,63,64,66]],[854,[57,58,59,60,61,62,63,64,67]],[853,[57,58,59,60,61,62,63,64,65,66,67]],[852,[58,59,60,61,62,63,64,65,66,67]],[851,[60,61,62,63,64,65,66,67]],[850,[60,61,62,63,64,65,66,67,68]],[849,[58,59,60,61,62,63,64,65,66,67,68]],[848,[58,59,60,61,62,63,64,65,66,67,68,69,70,71,72]],[847,[58,59,60,61,62,63,64,65,66,67,68,69,70,71,72,73]],[846,[59,60,61,62,63,64,65,66,67,68,69,70,71,72,73]],[845,[61,62,63,64,65,66,67,68,69,70,71,72,73]],[844,[63,64,65,66,67,68,69,70,71,72,73]],[843,[63,64,65,66,67,68,69,70,71,72,73]],[842,[66,67,68,69,70,71,72,73]],[841,[65,66,67,68,69,70,71,72,73]],[840,[66,67,68,69,70,71,72,73]],[839,[66,67,68,69,70,71,72,73]],[838,[67,68,69,70,71,72,73,74]],[837,[68,69,70,71,72,73,74,75]],[836,[70,71,72,73,74,75,76]],[835,[71,72,73,74,75,76]],[834,[71,72,73,74,75,76]],[833,[71,72,73,74,75,76]],[832,[73,74,75]]];
const MESH_INDEX=(()=>{const m={};let n=1;for(const [r,cols] of MESH_ROWS)for(const c of cols)m[r+'_'+(c+2100)]=n++;return m})();
function meshOf(lat,lon){const n=MESH_INDEX[Math.floor(lat*24)+'_'+Math.floor(lon*16)];return n?String(n).padStart(3,'0'):''}
// 区画の境界までの距離（m）… 境界近くは番号が隣とずれる可能性を表示
function edgeDist(lat,lon){const y=lat*24,x=lon*16;const dy=Math.min(y-Math.floor(y),Math.ceil(y)-y)/24*111000;const dx=Math.min(x-Math.floor(x),Math.ceil(x)-x)/16*111000*Math.cos(lat*Math.PI/180);return Math.min(dx,dy)}
const MUNI={'26101':'京都市北区','26102':'京都市上京区','26103':'京都市左京区','26104':'京都市中京区','26105':'京都市東山区','26106':'京都市下京区','26107':'京都市南区','26108':'京都市右京区','26109':'京都市伏見区','26110':'京都市山科区','26111':'京都市西京区','26201':'福知山市','26202':'舞鶴市','26203':'綾部市','26204':'宇治市','26205':'宮津市','26206':'亀岡市','26207':'城陽市','26208':'向日市','26209':'長岡京市','26210':'八幡市','26211':'京田辺市','26212':'京丹後市','26213':'南丹市','26214':'木津川市','26303':'大山崎町','26322':'久御山町','26343':'井手町','26344':'宇治田原町','26364':'笠置町','26365':'和束町','26366':'精華町','26367':'南山城村','26407':'京丹波町','26463':'伊根町','26465':'与謝野町'};

// ================= 小物 =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const APP_VER='3.9';
// マニュアル（PDF）はGoogleドライブに置き、サーバー経由で招待リンクを持つ人だけが開ける
// 更新のお知らせ（新しい版を上に足していく）
const CHANGELOG={
  '3.9':['記録をタップして、修正・削除できるように（写真の差し替えも）','下調べのメモを地図に表示（📝）。メモの場所から罠の設置もできる','「すべての記録を見る」を追加'],
  '3.8':['起動画面を新しいロゴ（TRAP HUNTER MAP）に','マニュアル（PDF）をGoogleドライブから開くように（招待リンクを持つ人だけ）'],
  '3.7':['起動画面とロゴを追加','アプリを更新したときに、このお知らせを表示','アプリからマニュアル（PDF）を開けるように（ホーム画面の下・⚙）'],
  '3.6':['ホーム画面の下と⚙に、アプリ・サーバーの版を表示'],
  '3.5':['ホーム画面のシカ事業の表示を「チーム合計」に'],
  '3.4':['撮った写真をスマホ（ダウンロード）にも保存','拡大表示に「スマホに保存」'],
  '3.3':['未送信のとき、原因（圏外・電波・招待リンク・サーバー）を画面に表示']
};
const verCmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`};
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms)}
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ================= IndexedDB（未送信キュー・写真） =================
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('wanalog',2);
    const tm=setTimeout(()=>rej(new Error('端末の保存領域を開けません。アプリ（Chromeのタブも）をすべて閉じてから開き直してください')),10000);
    r.onblocked=()=>toast('古い画面が開いたままです。アプリとChromeのタブをすべて閉じて開き直してください',6000);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'id'});if(!d.objectStoreNames.contains('thumbs'))d.createObjectStore('thumbs',{keyPath:'id'})};r.onsuccess=()=>{clearTimeout(tm);this.db=r.result;this.db.onversionchange=()=>{this.db.close();this.db=null};res(this.db)};r.onerror=()=>{clearTimeout(tm);rej(r.error)}})},
  // 写真の縮小版（自分が撮った写真・一度見た仲間の写真）を端末に保存 → 圏外でも見られる
  async thumbPut(id,data){let d;try{d=await this.open()}catch(e){return}return new Promise(res=>{const t=d.transaction('thumbs','readwrite');t.objectStore('thumbs').put({id,data,at:Date.now()});t.oncomplete=()=>res();t.onerror=()=>res()})},
  async thumbGet(id){let d;try{d=await this.open()}catch(e){return ''}return new Promise(res=>{const r=d.transaction('thumbs').objectStore('thumbs').get(id);r.onsuccess=()=>res(r.result?.data||'');r.onerror=()=>res('')})},
  async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('queue',mode);const s=t.objectStore('queue');const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  put(ev){return this.tx('readwrite',s=>s.put(ev))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  async all(){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('queue').objectStore('queue').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>a.seq-b.seq));r.onerror=()=>rej(r.error)})}
};

// ================= 定数 =================
const TRAP_TYPES=[{v:'くくりわな',l:'K',c:'k'},{v:'箱わな',l:'H',c:'h'},{v:'囲いわな',l:'F',c:'f'}];
const SPECIES=['ニホンジカ','イノシシ','アナグマ','アライグマ','ハクビシン','タヌキ','キツネ','ヌートリア','ノウサギ','その他'];
const DISPOSAL=['食肉加工施設','自家消費','埋設','保管庫'];
const CHECK_RESULTS=['異常なし','空はじき','掛け直し','破損・要修理','錯誤捕獲（放獣）'];
const WEATHERS=['晴れ','曇り','雨','雪','霧'];
const TYPE_JA={set:'設置',check:'見回り',catch:'捕獲',remove:'撤去',note:'メモ',fix:'位置補正',photo:'写真追加',edit:'情報修正',recEdit:'記録修正',recDel:'記録削除'};
const KIND_EN={'設置':'set','見回り':'check','捕獲':'catch','撤去':'remove','メモ':'note','位置補正':'fix','写真追加':'photo','情報修正':'edit'};
const NOIMG='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#e8ebe8"/></svg>');
const typeCls=t=>(TRAP_TYPES.find(x=>t&&t.indexOf(x.v.slice(0,2))===0)||{c:''}).c;

// ================= アプリ本体 =================
const App={
  cfg:LS.get('cfg',{api:'',token:''}),
  state:LS.get('state',null),
  history:LS.get('history',[]),
  queue:[],
  loc:null, place:LS.get('lastPlace',null), weather:null,
  syncing:false, lastErr:'',
  form:{},

  async init(){
    // 招待リンク (?api=...&token=...)
    const q=new URLSearchParams(location.search);
    if(q.get('api')&&q.get('token')){this.cfg={api:q.get('api'),token:q.get('token')};LS.set('cfg',this.cfg);history.replaceState(null,'',location.pathname);toast('設定を読み込みました')}
    {const mv=LS.get('state',null)?.manual?.ver;$('#splashVer').textContent='アプリ v'+APP_VER+(mv?'　マニュアル v'+mv:'')}
    setTimeout(()=>$('#splash').classList.add('hide'),2300);
    this.queue=await DB.all();
    this.render();
    setTimeout(()=>this.checkUpdateNotice(),2400);
    if(!this.cfg.api||!this.cfg.token){this.openSettings();}
    this.locate();
    this.sync();
    window.addEventListener('online',()=>{this.errKind='';this.lastErr='';this.sync()});
    window.addEventListener('offline',()=>this.render());
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){this.sync();if(!this.loc||Date.now()-this.loc.time>120000)this.locate()}});
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
  },

  me(){return this.state?.me?.name||this.cfg.name||''},
  // 未送信の原因：未接続／圏外／通信（電波）／招待リンク／サーバー（管理者）
  status(){const n=this.queue.length;
    if(!this.cfg.api||!this.cfg.token)return {level:'err',badge:'⚠ 未接続',title:'未接続：送り先が設定されていません',msg:`招待リンクを、このスマホのChromeで開き直してください（LINEのリンクを長押し→コピー→Chromeに貼り付け）。${n?`記録${n}件はスマホに残っていて、つながると自動で送られます。`:''}`,retry:false};
    if(!navigator.onLine||this.errKind==='offline')return n?{level:'warn',badge:'圏外 未送信'+n,title:`圏外のため未送信 ${n}件`,msg:'電波が戻ると自動で送ります。故障ではありません。',retry:false}:{level:'',badge:'圏外',title:'',msg:''};
    if(this.lastErr&&n){
      if(this.errKind==='net')return {level:'warn',badge:'⚠ 通信できず '+n,title:`電波・通信の問題で未送信 ${n}件`,msg:this.lastErr+'。電波の良い所で「もう一度送る」を押してください。記録はスマホに残っています。',retry:true};
      if(this.errKind==='auth')return {level:'err',badge:'⚠ 招待リンク',title:'招待リンクが使えません（システム側）',msg:this.lastErr+'。管理者に新しい招待リンクをもらって開き直してください。記録はスマホに残っています。',retry:false};
      return {level:'err',badge:'⚠ サーバー '+n,title:`サーバー側の問題で未送信 ${n}件（システム側）`,msg:'内容：'+this.lastErr+'。この画面のスクショを管理者に送ってください。記録はスマホに残っています。',retry:true};
    }
    if(n)return {level:'warn',badge:'未送信 '+n,title:'',msg:'',retry:false};
    return {level:'',badge:'✓ 同期済',title:'',msg:''};
  },
  prefix(){return this.state?.me?.prefix||(this.me()||'?').charAt(0)},
  settings(){return this.state?.settings||{seasonStart:'2026-11-15',seasonEnd:'2027-03-15',otherEnd:'2027-02-15',deerEnd:'2027-02-28',deerReport:'2027-03-04',checkWarnDays:1,group:''}},

  // サーバーの罠一覧 + 未送信イベントを反映した見かけの罠一覧
  traps(){
    const m=new Map();
    for(const t of (this.state?.traps||[]))m.set(t.id,{...t});
    for(const q of this.queue){const e=q.ev;
      if(e.type==='recDel'){if(e.kind==='set')m.delete(e.trapId);else if(e.kind==='remove'&&m.has(e.trapId)){const t=m.get(e.trapId);t.status='稼働中';t.removeDate='';t.pending=true}continue}
      if(e.type==='recEdit'){if(e.kind==='set'&&e.fields?.memo!=null&&m.has(e.trapId))m.get(e.trapId).memo=e.fields.memo;continue}
      if(e.type==='set'){m.set(e.trapId,{id:e.trapId,type:e.trapType,owner:e.owner||this.me(),status:'稼働中',setDate:e.date,mesh:e.mesh,city:e.city,oaza:e.oaza,lat:e.lat,lon:e.lon,memo:e.memo,lastCheck:e.date,catches:0,pending:true})}
      else if(m.has(e.trapId)){const t=m.get(e.trapId);
        if(e.type==='check'||e.type==='catch'){if(!t.lastCheck||e.date>t.lastCheck)t.lastCheck=e.date;t.pending=true}
        if(e.type==='catch')t.catches=(+t.catches||0)+(+e.male||0)+(+e.female||0)+(+e.unknown||0);
        if(e.type==='remove'){t.status='撤去済';t.removeDate=e.date;t.pending=true}
        if(e.type==='fix'){Object.assign(t,{lat:e.lat,lon:e.lon,mesh:e.mesh,city:e.city||t.city,oaza:e.oaza||t.oaza,pending:true})}
        if(e.type==='edit'){Object.assign(t,{type:e.trapType||t.type,owner:e.owner||t.owner,setDate:e.setDate||t.setDate,memo:e.trapMemo??t.memo,pending:true});
          if(e.restore){t.status='稼働中';t.removeDate=''}else if(e.removeDate)t.removeDate=e.removeDate}
      }}
    return [...m.values()];
  },
  activeTraps(){return this.traps().filter(t=>t.status==='稼働中').sort((a,b)=>(a.owner===this.me()?0:1)-(b.owner===this.me()?0:1)||a.id.localeCompare(b.id,'ja'))},

  // ---------- 位置 ----------
  locate(){
    if(!navigator.geolocation){this.loc=null;this.render();return}
    this.locating=true;this.render();
    navigator.geolocation.getCurrentPosition(p=>{
      this.locating=false;
      this.loc={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),time:Date.now()};
      this.loc.mesh=meshOf(this.loc.lat,this.loc.lon);
      this.render();this.reverse();this.fetchWeather();
      if(this.form.useLoc)this.renderForm();
    },err=>{this.locating=false;this.locErr=err.code===1?'位置情報が許可されていません':'位置を取得できません';this.render()},{enableHighAccuracy:true,timeout:25000,maximumAge:20000});
  },
  async reverse(){
    const l=this.loc;if(!l||!navigator.onLine)return;
    try{const r=await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${l.lat}&lon=${l.lon}`);const j=await r.json();
      if(j&&j.results){const cd=String(j.results.muniCd||'');this.place={lat:l.lat,lon:l.lon,city:MUNI[cd]||(cd.startsWith('26')?'':'京都府外'),oaza:(j.results.lv01Nm||'').replace(/^－$/,'')};LS.set('lastPlace',this.place);this.render();if(this.form.useLoc)this.renderForm()}}catch(e){}
  },
  placeNow(){const l=this.loc,p=this.place;if(l&&p&&Math.abs(p.lat-l.lat)<0.002&&Math.abs(p.lon-l.lon)<0.002)return p;return null},
  async fetchWeather(){
    const l=this.loc;if(!l||!navigator.onLine)return;
    try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`);const j=await r.json();
      const c=j.current;if(!c)return;const w=c.weather_code;
      this.weather={temp:Math.round(c.temperature_2m),w:w<=1?'晴れ':w<=3?'曇り':(w===45||w===48)?'霧':(w>=71&&w<=77)||w===85||w===86?'雪':'雨'};
    }catch(e){}
  },

  // ---------- 描画 ----------
  render(){
    $('#meName').textContent=this.me()?'・'+this.me():'';
    const b=$('#syncBadge');const n=this.queue.length;
    const st=this.status();
    b.className='badge'+(st.level==='err'?' err':st.level==='warn'?' warn':'');
    b.textContent=this.syncing?(this.syncLabel||'送信中')+'…':st.badge;
    const s=this.settings(),t=today();
    let h='';
    // 警告
    if(!this.syncing&&st.msg)h+=`<div class="alert${st.level==='err'?' red':''}"><b>${esc(st.title)}</b><br>${esc(st.msg)}${st.retry?`<br><button class="iconbtn" style="margin-top:6px" onclick="App.sync(true)">もう一度送る</button>`:''}</div>`;
    if(t<s.seasonStart||t>s.seasonEnd)h+=`<div class="alert">今日は猟期外です（猟期 ${md(s.seasonStart)}〜${md(s.seasonEnd)}）。</div>`;
    else if(t>s.otherEnd)h+=`<div class="alert">シカ・イノシシ以外の猟期は ${md(s.otherEnd)} で終了しています。</div>`;
    const late=this.activeTraps().filter(x=>x.owner===this.me()&&x.lastCheck&&daysBetween(x.lastCheck,t)>s.checkWarnDays);
    if(late.length)h+=`<div class="alert red">見回りが空いている罠：${late.map(x=>esc(x.id)).join('、')}</div>`;
    // 位置
    const l=this.loc,p=this.placeNow();
    const meshTxt=l?(l.mesh||'府外'):'---';
    const near=l&&l.mesh&&edgeDist(l.lat,l.lon)<Math.max(30,l.acc);
    h+=`<div class="card"><div class="loc"><div class="mesh"><div class="l">位置図番号</div><div class="n">${esc(meshTxt)}</div></div>
      <div class="place"><div class="p1">${p?esc((p.city||'')+(p.oaza||'')):(l?(navigator.onLine?'住所を取得中…':'住所は送信時に自動入力'):'')}${this.locating?'<span class="small"> 測位中…</span>':''}</div>
      <div class="p2">${l?`精度 ±${l.acc}m・${new Date(l.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`:esc(this.locErr||'位置を取得していません')}</div>
      ${near?'<div class="p2" style="color:var(--orange)">区画の境界付近です。番号を確認してください</div>':''}</div>
      <button class="iconbtn" onclick="App.locate()">現在地</button></div></div>`;
    // ボタン
    h+=`<div class="grid">
      <button class="act a-set" onclick="App.formSet()">罠を設置<small>新しい罠・移設</small></button>
      <button class="act a-check" onclick="App.formCheck()">見回り<small>まとめて記録</small></button>
      <button class="act a-catch" onclick="App.formCatch()">捕獲<small>獲れた！</small></button>
      <button class="act a-remove" onclick="App.formRemove()">撤去<small>罠を外した</small></button>
      <button class="act a-note" onclick="App.formNote()">痕跡・メモ <small>足跡・ヌタ場・写真</small></button></div>`;
    // 罠一覧
    const traps=this.activeTraps();
    h+=`<h2><span>稼働中の罠（${traps.length}基）</span><span class="small">自分 ${traps.filter(x=>x.owner===this.me()).length}基</span></h2><div class="card">`;
    if(!traps.length)h+=`<div class="empty">稼働中の罠はありません。「罠を設置」から登録します。</div>`;
    for(const x of traps){const d=x.lastCheck?daysBetween(x.lastCheck,t):null;
      h+=`<div class="trap" onclick="App.trapMenu('${esc(x.id)}')"><div class="id">${esc(x.id)}</div>
      <div class="info"><span class="tag ${typeCls(x.type)}">${esc(x.type)}</span>${x.pending?'<span class="tag pending">未送信</span>':''}${this.trapPhotos(x.id).length?`<span class="tag cam">写真${this.trapPhotos(x.id).length}</span>`:''}<br><b>${esc(x.mesh||'---')}</b> ${esc((x.oaza||x.city||''))}・${esc(x.owner)}${+x.catches?`・捕獲${x.catches}`:''}</div>
      <div class="days ${d!=null&&d>s.checkWarnDays?'late':''}">${d==null?'-':d===0?'今日':d+'日前'}</div></div>`}
    h+=`</div>`;
    // シカ事業
    const deer=this.state?.deer;
    if(deer){const pct=Math.min(100,deer.total/Math.max(deer.min,1)*100);
      h+=`<h2><span>シカ捕獲強化事業（チーム合計）</span></h2><div class="card deer">
      <div><b style="font-size:22px">${deer.total}</b> 頭 <span class="small">（対象期間 〜${md(s.deerEnd)}・${deer.min}頭以上で支給）</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="small">${deer.eligible?`奨励金見込 ${deer.amount.toLocaleString()}円`:`あと ${deer.min-deer.total} 頭で支給対象`}・完了報告期限 ${md(s.deerReport)}</div>
      ${t>s.deerEnd?'<div class="small" style="color:var(--red)">対象期間は終了しました（3/1以降の捕獲は対象外）</div>':''}</div>`}
    // 履歴
    const recs=this.records();
    if(recs){h+=`<h2><span>最近の記録</span><span class="small">タップで詳細・修正</span></h2><div class="card">`;
      if(!recs.length)h+=`<div class="empty">まだ記録がありません</div>`;
      h+=recs.slice(0,15).map(r=>this.recRow(r)).join('');
      if(recs.length>15)h+=`<button class="btn sec" style="margin-top:10px" onclick="App.recList()">すべての記録を見る（${recs.length}件）</button>`;
      h+=`</div>`}
    const recent=recs?[]:[...this.queue.map(q=>({...q.ev,pending:true})).reverse(),...this.history].slice(0,15);
    if(!recs){h+=`<h2><span>最近の記録</span></h2><div class="card">`;
    if(!recent.length)h+=`<div class="empty">まだ記録がありません</div>`;}
    for(const e of recent){h+=`<div class="log"><div class="t">${md(e.date)} ${esc(e.time||'')}</div><div>${e.pending?'<span class="tag pending">未送信</span>':''}<b>${TYPE_JA[e.type]}</b> ${esc(e.trapId||'')} ${esc(e.species||'')}${e.type==='catch'?` ♂${e.male||0} ♀${e.female||0}${+e.unknown?' 不明'+e.unknown:''}`:''} ${esc(e.checkResult&&e.checkResult!=='異常なし'?e.checkResult:'')} <span class="small">${esc(e.mesh||'')}${e.byName&&e.byName!==this.me()?'・'+esc(e.byName):''}</span></div></div>`}
    h+=`${recs?'':'</div>'}<button class="btn sec" style="margin-top:14px" onclick="App.openManual()">📖 使い方マニュアル${this.state?.manual?.ver?' v'+esc(this.state.manual.ver):''}（PDF）</button><p class="small" style="text-align:center">データはスプレッドシートに保存され、PCで編集できます。<br>わな猟日誌 アプリ v${APP_VER}${this.state?.serverVer?`・サーバー v${esc(this.state.serverVer)}`:''}</p>`;
    $('#main').innerHTML=h;
  },

  // ---------- シート（入力画面） ----------
  openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open');$('#sheetBg').classList.add('open');$('#sheet').scrollTop=0},
  closeSheet(){$('#sheet').classList.remove('open');$('#sheetBg').classList.remove('open');this.form={}},
  renderForm(){if(this.form.render)this.form.render()},
  chipHtml(name,opts,val){return `<div class="chips">${opts.map(o=>`<button type="button" class="chip ${o===val?'on':''}" onclick="App.setF('${name}','${esc(o)}')">${esc(o)}</button>`).join('')}</div>`},
  setF(k,v){this.form[k]=this.form[k]===v&&this.form.toggle?.includes(k)?'':v;this.renderForm()},
  readInputs(){$('#sheetBody').querySelectorAll('[data-f]').forEach(el=>{this.form[el.dataset.f]=el.type==='checkbox'?el.checked:el.value})},
  locBlock(){
    const l=this.loc,p=this.placeNow(),f=this.form;
    if(f.preset){const q=f.preset;return `<label class="f">場所</label><div class="card" style="margin:0"><div class="loc"><div class="mesh"><div class="l">位置図番号</div><div class="n">${esc(q.mesh||'---')}</div></div>
      <div class="place"><div class="p1">${esc((q.city||'')+(q.oaza||''))||'住所は送信時に自動入力'}</div><div class="p2">下調べメモの位置</div></div>
      <button class="iconbtn" type="button" onclick="App.readInputs();App.form.preset=null;App.locate();App.renderForm()">現在地にする</button></div>
      <div class="preset">📝 下調べメモ（${md(q.date)}）の場所を使っています。罠を少し離れた所に掛けたときは「現在地にする」を押してください。</div></div>`}

  addPhoto(){this.readInputs();const fi=$('#fileIn');fi.value='';fi.onchange=async()=>{const f=fi.files[0];if(!f)return;if(this.savePhotosOn())this.download(f,'wana_'+stamp()+'.jpg','写真をスマホ（ダウンロード）にも保存しました');else toast('写真を縮小しています…',1500);const dataUrl=await resizeImage(f,1280,.75);const thumb=await resizeImage(f,360,.7);(this.form.photos=this.form.photos||[]).push({dataUrl,thumb});this.renderForm()};fi.click()},

  // ---------- 罠の写真 ----------
  // サーバーの写真（設置・見回り・捕獲・写真追加）＋未送信の写真。新しい順
  trapPhotos(id){
    const t=(this.state?.traps||[]).find(x=>x.id===id);
    const gone=this.gonePhotos();
    const out=(t?.photos||[]).filter(p=>!gone.has(p.id)).map(p=>({...p,kind:KIND_EN[p.kind]||p.kind}));
    for(const q of this.queue){const e=q.ev;if(e.trapId!==id||!(e.photos||[]).length)continue;
      e.photos.forEach((p,i)=>out.push({local:q.id+'_'+i,src:p.thumb||p.dataUrl,full:p.dataUrl,date:e.date,time:e.time,kind:e.type,by:e.byName,pending:true}))}
    return out.sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  },
  imgTag(p,extra=''){return p.local?`<img src="${p.src}" ${extra} onclick="event.stopPropagation();App.viewPhoto('${esc(p.local)}')">`:`<img src="${NOIMG}" data-pid="${esc(p.id)}" ${extra} onclick="event.stopPropagation();App.viewPhoto('${esc(p.id)}')">`},
  stripHtml(id,max){const ps=this.trapPhotos(id);if(!ps.length)return '';
    return `<div class="pstrip">${ps.slice(0,max).map(p=>this.imgTag(p)).join('')}</div>${ps.length>max?`<div class="mini">ほか${ps.length-max}枚</div>`:''}`},
  thumbMem:{},
  // data-pid の画像に縮小版を入れる（メモリ → 端末 → サーバーの順）
  async fillThumbs(root){if(!root)return;const els=[...root.querySelectorAll('img[data-pid]')];const need=[];
    for(const el of els){const id=el.dataset.pid;let d=this.thumbMem[id];if(!d){d=await DB.thumbGet(id);if(d)this.thumbMem[id]=d}
      if(d)el.src=d;else if(!need.includes(id))need.push(id)}
    if(!need.length||!navigator.onLine||!this.cfg.api)return;
    for(let i=0;i<need.length;i+=8){try{const r=await this.post({action:'thumbs',ids:need.slice(i,i+8)});
      for(const [id,d] of Object.entries(r.images||{})){if(!d)continue;this.thumbMem[id]=d;DB.thumbPut(id,d);document.querySelectorAll(`img[data-pid="${id}"]`).forEach(el=>el.src=d)}}catch(e){break}}
  },
  openPhotos(id){const ps=this.trapPhotos(id);
    let h=ps.length?'':'<div class="empty">まだ写真がありません</div>',day='';
    for(const p of ps){if(p.date!==day){if(day)h+='</div>';day=p.date;h+=`<div class="pday">${md(day)}</div><div class="pgrid">`}
      h+=`<figure>${this.imgTag(p)}<figcaption>${esc(TYPE_JA[p.kind]||p.kind)}${p.time?' '+esc(p.time):''}${p.by?'・'+esc(p.by):''}${p.pending?'・未送信':''}</figcaption></figure>`}
    if(day)h+='</div>';
    this.form={};this.openSheet(id+' の写真',h+`<button class="btn" onclick="App.formPhoto('${esc(id)}')">写真を追加</button>`);this.fillThumbs($('#sheetBody'))},
  // 拡大表示（端末にある縮小版をすぐ出し、電波があれば元の写真に差し替え）
  async viewPhoto(key){let p=null;for(const t of this.traps())for(const x of this.trapPhotos(t.id))if(x.id===key||x.local===key)p=x;
    if(!p)for(const r of this.records()||[]){for(const x of this.recPhotos(r))if(x.id===key||x.local===key)p=x}
    if(!p)return;const img=$('#viewerImg');$('#viewerCap').textContent=`${md(p.date)} ${p.time||''} ${TYPE_JA[p.kind]||p.kind||''}${p.by?'・'+p.by:''}`;
    $('#viewer').classList.add('open');
    if(p.local){img.src=p.full||p.src;return}
    img.src=this.thumbMem[p.id]||await DB.thumbGet(p.id)||NOIMG;
    if(this.fullMem?.[p.id]){img.src=this.fullMem[p.id];return}
    if(!navigator.onLine||!this.cfg.api){$('#viewerCap').textContent+='（圏外のため縮小版）';return}

  // ---------- 地図 ----------
  map:null, base:'std', showGrid:true, showRemoved:false, layers:{}, fixing:null,
  ensureMap(){
    if(this.map)return true;
    if(typeof L==='undefined'){toast('地図の部品を読み込めません。電波のある所で一度開いてください',4000);return false}
    const m=this.map=L.map('map',{zoomControl:true,attributionControl:true}).setView([35.30,135.26],12);
    this.layers.std=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'});
    this.layers.photo=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'});
    this.layers.std.addTo(m);
    this.layers.grid=L.layerGroup().addTo(m);this.layers.traps=L.layerGroup().addTo(m);this.layers.me=L.layerGroup().addTo(m);
    m.on('zoomend moveend',()=>this.drawGrid());
    m.on('move',()=>{if(this.fixing)this.updateFixPanel()});
    return true;
  },
  openMap(focusId,startFix){
    $('#mapView').classList.add('open');
    if(!this.ensureMap())return;
    setTimeout(()=>{this.map.invalidateSize();this.drawTraps();this.drawGrid();this.drawMe();
      const t=focusId&&this.traps().find(x=>x.id===focusId);
      if(t&&t.lat&&t.lon){this.map.setView([+t.lat,+t.lon],17);if(!startFix)this.trapMarkers[focusId]?.openPopup()}
      else if(this.loc)this.map.setView([this.loc.lat,this.loc.lon],15);
      else{const a=this.activeTraps().filter(x=>x.lat&&x.lon);if(a.length)this.map.fitBounds(a.map(x=>[+x.lat,+x.lon]),{maxZoom:16,padding:[30,30]})}
      if(startFix&&focusId)this.startFix(focusId);
    },50);
  },
  closeMap(){this.cancelFix();$('#mapView').classList.remove('open')},
  setBase(b){if(!this.map)return;this.map.removeLayer(this.layers[this.base]);this.base=b;this.layers[b].addTo(this.map);this.layers[b].bringToBack();$('#bStd').classList.toggle('on',b==='std');$('#bPhoto').classList.toggle('on',b==='photo')},
  toggleGrid(){this.showGrid=!this.showGrid;$('#bGrid').classList.toggle('on',this.showGrid);this.drawGrid()},
  toggleRemoved(){this.showRemoved=!this.showRemoved;$('#bOld').classList.toggle('on',this.showRemoved);this.drawTraps()},
  mapToMe(){if(this.loc)this.map.setView([this.loc.lat,this.loc.lon],Math.max(this.map.getZoom(),16));this.locate();setTimeout(()=>this.drawMe(),1500)},
  drawMe(){if(!this.map)return;const g=this.layers.me;g.clearLayers();const l=this.loc;if(!l)return;
    L.circle([l.lat,l.lon],{radius:l.acc,weight:1,color:'#2a5b8a',fillOpacity:.1}).addTo(g);
    L.circleMarker([l.lat,l.lon],{radius:7,weight:3,color:'#fff',fillColor:'#2a5b8a',fillOpacity:1}).addTo(g)},
  // 位置図の区画線と番号
  drawGrid(){if(!this.map)return;const g=this.layers.grid;g.clearLayers();if(!this.showGrid)return;
    const z=this.map.getZoom(),b=this.map.getBounds().pad(0.2);
    for(const k in MESH_INDEX){const [r,c]=k.split('_').map(Number);const s=r/24,n=(r+1)/24,w=c/16,e=(c+1)/16;
      if(n<b.getSouth()||s>b.getNorth()||e<b.getWest()||w>b.getEast())continue;
      L.rectangle([[s,w],[n,e]],{color:'#c8611d',weight:z>=13?2:1.2,fill:false,dashArray:'6 4',interactive:false}).addTo(g);
      if(z>=10){const num=String(MESH_INDEX[k]).padStart(3,'0');
        L.marker([n,w],{interactive:false,icon:L.divIcon({className:'',html:`<span class="mesh-label">${num}</span>`,iconAnchor:[-4,-4]})}).addTo(g)}}
  },
  trapMarkers:{},
  drawTraps(){if(!this.map)return;const g=this.layers.traps;g.clearLayers();this.trapMarkers={};const t0=today(),s=this.settings();
    const list=this.traps().filter(t=>t.lat&&t.lon&&(t.status==='稼働中'||this.showRemoved));
    for(const t of list){const mine=t.owner===this.me(),active=t.status==='稼働中';
      const late=active&&t.lastCheck&&daysBetween(t.lastCheck,t0)>s.checkWarnDays;
      const col=!active?'#888':late?'#b3261e':mine?'#2f5d43':'#2a5b8a';
      const mk=L.circleMarker([+t.lat,+t.lon],{radius:10,weight:3,color:'#fff',fillColor:col,fillOpacity:active?1:.5}).addTo(g);
      const np=this.trapPhotos(t.id).length;
      mk.bindTooltip(esc(t.id)+(np?' 📷':''),{permanent:true,direction:'right',offset:[10,0],className:'trap-label'});
      const gm=`https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lon}`;
      mk.bindPopup(`<b style="font-size:16px">${esc(t.id)}</b> ${esc(t.type)}<br>${esc(t.status)}・設置者 ${esc(t.owner)}<br><b>${esc(t.mesh||'---')}</b> ${esc((t.city||'')+(t.oaza||''))}<br><span style="color:#666">設置 ${md(t.setDate)}${active?`・見回り ${md(t.lastCheck)||'-'}`:`・撤去 ${md(t.removeDate)}`}</span>
        <button class="pbtn" style="background:#2a5b8a" onclick="App.trapMenu('${esc(t.id)}')">詳細・記録・編集</button>
        ${this.stripHtml(t.id,3)}${np?`<button class="pbtn sec" onclick="App.openPhotos('${esc(t.id)}')">写真をすべて見る（${np}枚）</button>`:''}
        ${active?`<button class="pbtn" onclick="App.startFix('${esc(t.id)}')">位置を補正する</button>`:''}
        <a class="pbtn sec" href="${gm}" target="_blank" rel="noopener">Googleマップで開く</a>`);
      mk.on('popupopen',e=>this.fillThumbs(e.popup.getElement()));
      this.trapMarkers[t.id]=mk}
    this.drawNotes();
  },
  // 下調べ・痕跡メモ（位置のあるもの）を📝で表示
  showNotes:true,noteMarkers:{},
  toggleNotes(){this.showNotes=!this.showNotes;$('#bNote').classList.toggle('on',this.showNotes);this.drawNotes()},
  drawNotes(){if(!this.map)return;const g=this.layers.notes||(this.layers.notes=L.layerGroup().addTo(this.map));g.clearLayers();this.noteMarkers={};if(!this.showNotes)return;
    for(const r of (this.records()||[]).filter(x=>x.kind==='note'&&x.lat&&x.lon)){
      const mk=L.marker([+r.lat,+r.lon],{icon:L.divIcon({className:'',html:'<div class="note-pin">📝</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(g);
      const np=this.recPhotos(r).length,gm=`https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`;
      mk.bindTooltip(esc((r.memo||'メモ').slice(0,12))+(np?' 📷':''),{direction:'right',offset:[14,0],className:'trap-label'});
      mk.bindPopup(`<b style="font-size:15px">📝 ${md(r.date)} ${esc(r.time||'')}</b>${r.by?'・'+esc(r.by):''}${r.pending?'・未送信':''}<br><b>${esc(r.mesh||'---')}</b> ${esc((r.city||'')+(r.oaza||''))}
        ${r.memo?`<div style="margin-top:4px;white-space:pre-wrap">${esc(r.memo)}</div>`:''}${this.recStrip(r,3)}
        <button class="pbtn" style="background:#7a5a2f" onclick="App.recMenu('${esc(r.id)}')">詳細・修正・削除</button>
        <button class="pbtn" onclick="App.closeMap();App.setFromNote('${esc(r.id)}')">この場所で罠を設置</button>
        <a class="pbtn sec" href="${gm}" target="_blank" rel="noopener">Googleマップで開く</a>`);
      mk.on('popupopen',e=>this.fillThumbs(e.popup.getElement()));
      this.noteMarkers[r.id]=mk}
  },
  openNoteOnMap(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r||!r.lat)return;this.closeSheet();this.openMap();
    setTimeout(()=>{if(!this.showNotes)this.toggleNotes();this.map.setView([+r.lat,+r.lon],17);this.noteMarkers[id]?.openPopup()},120)},
  setFromNote(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r)return;
    this.formSet({lat:r.lat,lon:r.lon,mesh:r.mesh||meshOf(+r.lat,+r.lon),city:r.city,oaza:r.oaza,date:r.date,memo:r.memo?'（下調べ）'+r.memo:''})},

  // ---------- 記録の一覧・修正・削除 ----------
  // サーバーの記録 ＋ 未送信の記録 ＋ 未送信の修正・削除 を重ねた一覧（新しい順）。古いサーバーなら null
  records(){
    if(!this.state||!Array.isArray(this.state.recs))return null;
    let list=this.state.recs.map(r=>({...r,photos:[...(r.photos||[])]}));
    const KINDS=['set','check','catch','remove','note','photo'];
    for(const q of this.queue){const e=q.ev;if(!KINDS.includes(e.type))continue;
      list.push({id:e.id,date:e.date,time:e.time,by:e.byName,kind:e.type,trapId:e.trapId||'',gear:e.trapType||'',mesh:e.mesh||'',city:e.city||'',oaza:e.oaza||'',lat:e.lat,lon:e.lon,
        checkResult:e.checkResult||'',species:e.species||'',male:+e.male||0,female:+e.female||0,unknown:+e.unknown||0,weight:e.weight||'',disposal:e.disposal||'',memo:e.memo||'',
        photos:[],local:(e.photos||[]).map((p,i)=>({local:q.id+'_'+i,src:p.thumb||p.dataUrl,full:p.dataUrl})),pending:true,qid:q.id})}
    for(const q of this.queue){const e=q.ev;
      if(e.type==='recEdit'){const r=list.find(x=>x.id===e.target);if(!r)continue;const f={...(e.fields||{})};if(r.kind==='set'||r.kind==='remove')delete f.date;Object.assign(r,f);
        if(e.removePhotos?.length)r.photos=r.photos.filter(p=>!e.removePhotos.includes(p));
        (e.photos||[]).forEach((p,i)=>(r.local=r.local||[]).push({local:q.id+'_'+i,src:p.thumb||p.dataUrl,full:p.dataUrl}));r.edited=true}
      if(e.type==='recDel'){const r=list.find(x=>x.id===e.target);if(!r)continue;
        if(r.kind==='set'&&r.trapId)list=list.filter(x=>x.kind==='note'||x.trapId!==r.trapId||x.date<r.date);
        list=list.filter(x=>x.id!==e.target)}}
    return list.sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  },
  // 修正で外した写真・削除した記録の写真（未送信の間も隠す）
  gonePhotos(){const s=new Set();const recs=this.state?.recs||[];
    for(const q of this.queue){const e=q.ev;
      if(e.type==='recEdit')(e.removePhotos||[]).forEach(id=>s.add(id));
      if(e.type==='recDel'){const r=recs.find(x=>x.id===e.target);if(r)(r.photos||[]).forEach(id=>s.add(id))}}
    return s},
  recPhotos(r){return [...(r.photos||[]).map(id=>({id,date:r.date,time:r.time,kind:r.kind,by:r.by})),...(r.local||[]).map(p=>({...p,date:r.date,time:r.time,kind:r.kind,by:r.by,pending:true}))]},
  recStrip(r,max){const ps=this.recPhotos(r);if(!ps.length)return '';return `<div class="pstrip">${ps.slice(0,max).map(p=>this.imgTag(p)).join('')}</div>${ps.length>max?`<div class="mini">ほか${ps.length-max}枚</div>`:''}`},
  recTitle(r){return `${TYPE_JA[r.kind]||r.kind}${r.trapId?' '+r.trapId:''}`},
  recSummary(r){if(r.kind==='catch')return `${r.species||''} ♂${r.male||0} ♀${r.female||0}${+r.unknown?' 不明'+r.unknown:''}`;
    if(r.kind==='check')return r.checkResult&&r.checkResult!=='異常なし'?r.checkResult:'';
    return (r.memo||'').slice(0,24)},
  recRow(r){const np=this.recPhotos(r).length;
    return `<div class="log tap" onclick="App.recMenu('${esc(r.id)}')"><div class="t">${md(r.date)} ${esc(r.time||'')}</div><div>${r.pending?'<span class="tag pending">未送信</span>':''}${r.edited?'<span class="tag pending">修正中</span>':''}<b>${esc(this.recTitle(r))}</b> ${esc(this.recSummary(r))} ${np?`<span class="tag cam">📷${np}</span>`:''}<span class="small"> ${esc(r.mesh||'')}${r.by&&r.by!==this.me()?'・'+esc(r.by):''}</span></div><div class="go">›</div></div>`},
  recList(kind){const all=this.records()||[];const list=kind?all.filter(r=>r.kind===kind):all;
    const opts=[['','すべて'],['note','メモ'],['set','設置'],['check','見回り'],['catch','捕獲'],['remove','撤去'],['photo','写真追加']];
    this.form={};this.openSheet('すべての記録',`<div class="chips">${opts.map(([k,l])=>`<button type="button" class="chip ${k===(kind||'')?'on':''}" onclick="App.recList('${k}')">${l}</button>`).join('')}</div>
      <div class="card" style="margin-top:10px">${list.length?list.map(r=>this.recRow(r)).join(''):'<div class="empty">記録がありません</div>'}</div>
      <div class="small">サーバーにある最近300件まで表示します。それより前の記録はPCのスプレッドシートで直してください。</div>`)},
  recMenu(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r){toast('この記録は見つかりません（削除済みかもしれません）');return}
    this.map?.closePopup();
    const d=[];
    if(r.kind==='catch')d.push(`鳥獣 ${esc(r.species||'-')}・♂${r.male||0} ♀${r.female||0}${+r.unknown?'・不明'+r.unknown:''}`,`推定体重 ${esc(r.weight||'-')}kg・処理 ${esc(r.disposal||'-')}`);
    if(r.kind==='check')d.push(`結果 ${esc(r.checkResult||'-')}`);
    const trap=r.trapId&&this.traps().find(t=>t.id===r.trapId);
    this.form={};this.openSheet(this.recTitle(r),`<div class="card">
      <div>${r.pending?'<span class="tag pending">未送信</span> ':''}${r.edited?'<span class="tag pending">修正（未送信）</span> ':''}<b>${md(r.date)} ${esc(r.time||'')}</b>・${esc(r.by||'')}</div>
      <div style="font-size:18px;font-weight:800;margin-top:4px">${esc(r.mesh||'---')} <span style="font-size:14px;font-weight:600">${esc((r.city||'')+(r.oaza||''))}</span></div>
      ${d.map(x=>`<div class="small">${x}</div>`).join('')}
      ${r.memo?`<div style="margin-top:6px;white-space:pre-wrap">${esc(r.memo)}</div>`:''}
      ${this.recStrip(r,8)}</div>
      <button class="btn" onclick="App.formRec('${esc(id)}')">この記録を修正する（文字・写真）</button>
      ${r.kind==='set'&&trap?`<button class="btn sec" onclick="App.formEdit('${esc(r.trapId)}')">罠の種類・設置者・設置日を直す</button>`:''}
      ${r.kind==='remove'&&trap?`<button class="btn sec" onclick="App.formEdit('${esc(r.trapId)}')">撤去日を直す</button>`:''}
      ${trap?`<button class="btn sec" onclick="App.trapMenu('${esc(r.trapId)}')">罠 ${esc(r.trapId)} を開く</button>`:''}
      ${r.kind==='note'&&r.lat&&r.lon?`<div class="row"><button class="btn sec" onclick="App.openNoteOnMap('${esc(id)}')">地図で見る</button><button class="btn sec" onclick="App.closeSheet();App.setFromNote('${esc(id)}')">この場所で罠を設置</button></div>`:''}
      ${this.recPhotos(r).length?`<button class="btn sec" onclick="App.saveRecPhotos('${esc(id)}')">写真をスマホに保存（${this.recPhotos(r).length}枚）</button>`:''}
      <button class="btn danger" style="margin-top:22px" onclick="App.delRec('${esc(id)}')">この記録を削除する</button>`);this.fillThumbs($('#sheetBody'))},
  formRec(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r)return;
    this.form={date:r.date,time:r.time,memo:r.memo||'',checkResult:r.checkResult||'異常なし',species:r.species||'',male:r.male||0,female:r.female||0,unknown:r.unknown||0,weight:r.weight||'',disposal:r.disposal||'',rm:[],rmLocal:[],photos:[],
      render:()=>{const f=this.form,fixedDate=r.kind==='set'||r.kind==='remove';
      const cur=this.recPhotos(r);
      this.openSheet(this.recTitle(r)+' を修正',`
      ${fixedDate?`<div class="small">${r.kind==='set'?'設置日':'撤去日'}・種類・設置者は「罠の情報を直す」で直します（${md(r.date)}）。</div>`:`<div class="row"><div><label class="f">日付</label><input type="date" data-f="date" value="${esc(f.date||'')}"></div><div><label class="f">時刻</label><input type="time" data-f="time" value="${esc(f.time||'')}"></div></div>`}
      ${r.kind==='check'?`<label class="f">見回り結果</label>${this.chipHtml('checkResult',CHECK_RESULTS,f.checkResult)}`:''}
      ${r.kind==='catch'?`<label class="f">鳥獣の種類</label>${this.chipHtml('species',SPECIES,f.species)}
        <div class="row">${['male','female','unknown'].map((k,i)=>`<div><label class="f">${['オス','メス','不明'][i]}</label><div class="stepper"><button type="button" onclick="App.step('${k}',-1)">−</button><span>${+f[k]||0}</span><button type="button" onclick="App.step('${k}',1)">＋</button></div></div>`).join('')}</div>
        <label class="f">推定体重（kg）</label><input type="number" inputmode="decimal" data-f="weight" value="${esc(f.weight||'')}">
        <label class="f">処理方法</label>${this.chipHtml('disposal',DISPOSAL,f.disposal)}`:''}
      <label class="f">${r.kind==='set'?'目印・設置場所メモ':'メモ'}</label><textarea data-f="memo">${esc(f.memo||'')}</textarea>
      ${cur.length?`<label class="f">今の写真（✕で外す・もう一度押すと戻す）</label><div class="photos">${cur.map(p=>{const key=p.id||p.local,on=p.id?f.rm.includes(p.id):f.rmLocal.includes(p.local);
        return `<span class="eph ${on?'rm':''}">${this.imgTag(p)}<button type="button" class="x" onclick="App.toggleRm('${esc(key)}',${p.id?1:0})">✕</button></span>`}).join('')}</div>`:''}
      ${this.photoBlock('写真を差し替えるときは、古い写真を✕で外して、新しい写真を撮ってください。')}
      <label class="f">直した理由（任意）</label><input type="text" data-f="reason" value="${esc(f.reason||'')}" placeholder="例：頭数の入力間違い">
      <button class="btn" onclick="App.saveRec('${esc(id)}')">この内容で保存</button>`);this.fillThumbs($('#sheetBody'))}};this.renderForm()},
  toggleRm(key,server){this.readInputs();const a=server?this.form.rm:this.form.rmLocal;const i=a.indexOf(key);if(i>=0)a.splice(i,1);else a.push(key);this.renderForm()},
  async saveRec(id){this.readInputs();const f=this.form;const r=(this.records()||[]).find(x=>x.id===id);if(!r)return;
    const keys=['memo'];if(r.kind!=='set'&&r.kind!=='remove')keys.push('date','time');
    if(r.kind==='check')keys.push('checkResult');if(r.kind==='catch')keys.push('species','male','female','unknown','weight','disposal');
    const fields={};for(const k of keys){const nv=['male','female','unknown'].includes(k)?(+f[k]||0):String(f[k]??'');const ov=['male','female','unknown'].includes(k)?(+r[k]||0):String(r[k]??'');if(nv!==ov)fields[k]=nv}
    if(fields.date===''||(fields.date&&!/^\d{4}-\d{2}-\d{2}$/.test(fields.date)))return toast('日付を入れてください');
    const newP=f.photos||[];
    if(!Object.keys(fields).length&&!f.rm.length&&!f.rmLocal.length&&!newP.length)return toast('変更がありません');
    // 未送信の記録は、送る前の中身を直接直す
    if(r.pending&&r.qid){if(this.syncing)return toast('送信中です。少し待ってからもう一度押してください',4000);
      const q=this.queue.find(x=>x.id===r.qid);if(!q)return toast('この記録は送信済みになりました。もう一度開き直してください');
      Object.assign(q.ev,fields);const keep=(q.ev.photos||[]).filter((p,i)=>!f.rmLocal.includes(q.id+'_'+i));q.ev.photos=[...keep,...newP];
      await DB.put(q);this.closeSheet();this.render();toast('修正しました（まだ未送信です）');return}
    if(f.rmLocal.length)toast('未送信の修正の写真は外せません。送信後にもう一度直してください',4000);
    const ev={id:uid(),type:'recEdit',date:today(),time:nowTime(),target:id,kind:r.kind,trapId:r.trapId||'',fields,removePhotos:[...f.rm],photos:newP,reason:f.reason||'',byName:this.me(),lat:'',lon:''};
    this.closeSheet();toast('記録を修正しました'+(newP.length?'（写真は順に送信します）':''));
    try{await this.enqueue(ev)}catch(e){toast('保存できませんでした：'+(e.message||e),6000)}
    if(this.map&&$('#mapView').classList.contains('open'))this.drawTraps()},
  async delRec(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r)return;
    const what=`${md(r.date)} ${this.recTitle(r)}${r.kind==='note'&&r.memo?'「'+r.memo.slice(0,20)+'」':''}`;
    if(r.kind==='set'){const n=(this.records()||[]).filter(x=>x.trapId===r.trapId&&x.id!==id&&x.kind!=='note'&&x.date>=r.date).length;
      if(!confirm(`罠 ${r.trapId} の設置記録を削除します。\n罠そのものと、この罠の見回り・捕獲・撤去・写真の記録${n?n+'件':''}もまとめて消えます。\n\n（テストや間違いで登録した罠のときだけ使ってください。罠を外したときは「撤去」です）`))return;
      if(!confirm(`本当に罠 ${r.trapId} を削除しますか？`))return}
    else{if(!confirm(`この記録を削除しますか？\n${what}${r.kind==='catch'?'\n\n捕獲の記録を消すと、提出書類の頭数からも消えます。':''}`))return}
    if(r.pending&&r.qid){if(this.syncing)return toast('送信中です。少し待ってからもう一度押してください',4000);
      const drop=new Set([r.qid]);if(r.kind==='set')for(const q of this.queue)if(q.ev.trapId===r.trapId&&q.seq>(this.queue.find(x=>x.id===r.qid)?.seq||0))drop.add(q.id);
      for(const k of drop)await DB.del(k);this.queue=this.queue.filter(q=>!drop.has(q.id));this.closeSheet();this.render();toast('送る前の記録を取り消しました');return}
    const ev={id:uid(),type:'recDel',date:today(),time:nowTime(),target:id,kind:r.kind,trapId:r.trapId||'',reason:'',byName:this.me(),lat:'',lon:''};
    this.closeSheet();toast('記録を削除しました（管理者はスプレッドシートの「削除済み記録」から戻せます）',4500);
    try{await this.enqueue(ev)}catch(e){toast('保存できませんでした：'+(e.message||e),6000)}
    if(this.map&&$('#mapView').classList.contains('open'))this.drawTraps()},
  // 写真をまとめてスマホに保存（ボタンを押したときなので保存されやすい）
  async saveRecPhotos(id){const r=(this.records()||[]).find(x=>x.id===id);if(!r)return;const ps=this.recPhotos(r);let n=0;
    for(const p of ps){let d=p.local?(p.full||p.src):(this.fullMem?.[p.id]);
      if(!d&&p.id&&navigator.onLine&&this.cfg.api){try{const x=await this.post({action:'photo',id:p.id});d=x.images?.[p.id];if(d)(this.fullMem=this.fullMem||{})[p.id]=d}catch(e){}}
      if(!d&&p.id)d=this.thumbMem[p.id]||await DB.thumbGet(p.id);
      if(d){this.download(d,`wana_${(r.date||'').replace(/-/g,'')}_${TYPE_JA[r.kind]||r.kind}_${++n}.jpg`);await new Promise(res=>setTimeout(res,400))}}
    toast(n?`${n}枚をスマホ（ダウンロード）に保存しました。保存されないときは⚙の説明を見てください`:'保存できる写真がありません',4500)},
  // 位置補正：地図を動かして十字に合わせる
  startFix(id){const t=this.traps().find(x=>x.id===id);if(!t)return;this.map.closePopup();
    this.fixing={id,orig:t.lat&&t.lon?[+t.lat,+t.lon]:null};
    if(this.fixing.orig){this.map.setView(this.fixing.orig,Math.max(this.map.getZoom(),17));
      this.fixLine=L.polyline([this.fixing.orig,this.fixing.orig],{color:'#c8611d',weight:2,dashArray:'4 4'}).addTo(this.map)}
    $('#crosshair').classList.add('open');$('#fixPanel').classList.add('open');this.updateFixPanel()},
  updateFixPanel(){const f=this.fixing;if(!f)return;const c=this.map.getCenter();const mesh=meshOf(c.lat,c.lng);
    let dist='';if(f.orig){const d=this.map.distance(f.orig,c);dist=`元の位置から ${d<1000?Math.round(d)+'m':(d/1000).toFixed(2)+'km'}`;this.fixLine?.setLatLngs([f.orig,[c.lat,c.lng]])}
    const changed=f.orig&&meshOf(f.orig[0],f.orig[1])!==mesh;
    $('#fixPanel').innerHTML=`<b>${esc(f.id)} の位置を補正</b><div class="small">地図を動かして、十字を罠の位置に合わせてください。${esc(dist)}</div>
      <div style="margin-top:6px">位置図番号 <b style="font-size:20px">${mesh||'府外'}</b>${changed?' <span style="color:#c8611d;font-weight:700">（番号が変わります）</span>':''}</div>
      <div class="row" style="display:flex;gap:8px"><button style="flex:1;background:#eee" onclick="App.cancelFix()">やめる</button><button style="flex:1;background:#eef4ee" onclick="App.fixToMe()">現在地に</button><button style="flex:2;background:#1f3a2b;color:#fff" onclick="App.saveFix()">この位置で保存</button></div>`},
  fixToMe(){if(!this.loc){toast('現在地がまだ取れていません');this.locate();return}this.map.setView([this.loc.lat,this.loc.lon],Math.max(this.map.getZoom(),17))},
  cancelFix(){this.fixing=null;$('#crosshair')?.classList.remove('open');$('#fixPanel')?.classList.remove('open');if(this.fixLine){this.map.removeLayer(this.fixLine);this.fixLine=null}},
  async saveFix(){const f=this.fixing;if(!f)return;const c=this.map.getCenter();const lat=+c.lat.toFixed(6),lon=+c.lng.toFixed(6);const mesh=meshOf(lat,lon);
    if(!mesh&&!confirm('京都府の位置図の区画外です。このまま保存しますか？'))return;
    let city='',oaza='';
    if(navigator.onLine){try{const r=await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lon}`);const j=await r.json();if(j&&j.results){const cd=String(j.results.muniCd||'');city=MUNI[cd]||'';oaza=(j.results.lv01Nm||'').replace(/^－$/,'')}}catch(e){}}
    const t=this.traps().find(x=>x.id===f.id);
    await this.enqueue({id:uid(),type:'fix',date:today(),time:nowTime(),trapId:f.id,trapType:t?.type||'',lat,lon,acc:'',mesh,city,oaza,memo:t?`補正前 ${t.mesh||''} ${t.lat||''},${t.lon||''}`:'',byName:this.me()});
    this.cancelFix();this.drawTraps();toast(`${f.id} の位置を補正しました（${mesh||'区画外'}）`)},

  // ---------- キューと同期 ----------
  async enqueue(ev,noSync){const item={id:ev.id,seq:Date.now()+Math.random(),ev};await DB.put(item);this.queue.push(item);this.render();if(!noSync)this.sync()},
  async post(body){
    const data=JSON.stringify({...body,token:this.cfg.token});
    // 写真付きは電波が弱いと時間がかかるので長めに待つ（約1MBごとに+60秒、最大4分）
    const limit=Math.min(240000,30000+Math.ceil(data.length/1e6)*60000);
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),limit);
    const fail=(msg,kind)=>{const e=new Error(msg);e.kind=kind;return e};
    let r,txt;
    try{r=await fetch(this.cfg.api,{method:'POST',body:data,signal:ctl.signal,redirect:'follow'});txt=await r.text()}
    catch(e){clearTimeout(tm);
      if(e.name==='AbortError')throw fail('時間切れ（電波が弱いか、写真が大きい）','net');
      throw fail(navigator.onLine?'サーバーにつながりません（電波が弱いか、サーバーURLの間違い）':'圏外です',navigator.onLine?'net':'offline')}
    clearTimeout(tm);
    let j;try{j=JSON.parse(txt)}catch(e){throw fail(/<html/i.test(txt)?'サーバーが応答しません（Apps Scriptのデプロイ・公開範囲）':'サーバーの応答が読めません','server')}
    if(!j.ok)throw fail(j.error||'サーバーエラー',/トークン/.test(j.error||'')?'auth':'server');
    return j
  },
  badgeTap(){const st=this.status();if(!this.cfg.api||!this.cfg.token)return this.openSettings();if(st.badge.startsWith('圏外'))return toast(st.msg||'圏外です',4000);this.sync(true)},
  async sync(manual){
    if(this.syncing||!this.cfg.api||!this.cfg.token)return;
    if(!navigator.onLine){this.lastErr='圏外です';this.errKind='offline';this.render();if(manual)toast('圏外です。電波が戻ったら自動で送ります');return}
    this.syncing=true;this.syncLabel='';this.render();
    const watchdog=setTimeout(()=>{if(this.syncing){this.syncing=false;this.lastErr='送信が止まりました';this.render()}},300000);
    try{
      this.queue=await DB.all();
      let res=null,done=0;const total=this.queue.length;
      while(this.queue.length){
        // 写真付きは1件ずつ、それ以外は最大20件まとめて
        const batch=[];for(const q of this.queue){if(batch.length&&(q.ev.photos||[]).length)break;batch.push(q);if((q.ev.photos||[]).length||batch.length>=20)break}
        const np=batch.reduce((n,b)=>n+(b.ev.photos||[]).length,0);
        this.syncLabel=np?`写真${np}枚を送信中`:`送信中 ${done+1}/${total}`;this.render();
        res=await this.post({action:'sync',events:batch.map(b=>b.ev)});done+=batch.length;
        const ok=new Set(res.applied||[]);
        // 自分が撮った写真の縮小版を、Driveのファイル名(ID)で端末に保存（再ダウンロード不要）
        for(const b of batch){const ids=res.photoIds?.[b.id];if(!ids)continue;(b.ev.photos||[]).forEach((p,i)=>{if(ids[i]&&p.thumb){this.thumbMem[ids[i]]=p.thumb;DB.thumbPut(ids[i],p.thumb)}})}
        for(const b of batch){if(ok.has(b.id)){await DB.del(b.id);const {photos,...lite}=b.ev;lite.photoCount=(photos||[]).length;this.history.unshift(lite)}}
        this.history=this.history.slice(0,60);LS.set('history',this.history);
        this.queue=await DB.all();
        if(!batch.every(b=>ok.has(b.id))){const e=new Error('サーバーで一部が保存されませんでした');e.kind='server';throw e}
      }
      if(!res)res=await this.post({action:'state'});
      this.state=res.state;LS.set('state',this.state);
      this.lastErr='';this.errKind='';if(manual)toast('同期しました');
    }catch(e){this.lastErr=String(e.message||e);this.errKind=e.kind||'server';this.lastTry=Date.now();if(manual)toast(this.status().msg,5000)}
    finally{clearTimeout(watchdog);this.syncing=false;this.syncLabel='';this.render();if(this.map&&$('#mapView').classList.contains('open')&&!this.fixing)this.drawTraps()}
  },

  // ---------- 設定 ----------
  openSettings(){this.form={};this.openSheet('設定',`
    <div class="small">招待リンクを開けば自動で入ります。手で入れる場合はスプレッドシートの「ユーザー」シートのトークンと、ウェブアプリのURLを入れてください。</div>
    <label class="f">サーバーURL（GASウェブアプリ）</label><input type="text" id="cfgApi" value="${esc(this.cfg.api)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="f">トークン</label><input type="text" id="cfgToken" value="${esc(this.cfg.token)}">
    <button class="btn" onclick="App.saveSettings()">保存して接続</button>
    <label class="checkrow" style="margin-top:14px"><input type="checkbox" id="cfgSavePhotos" ${this.savePhotosOn()?'checked':''} onchange="LS.set('savePhotos',this.checked);toast(this.checked?'撮った写真をスマホにも保存します':'スマホへの保存をやめました')"><span>アプリで撮った写真をスマホにも保存する（「ダウンロード」フォルダ）</span></label>
    <div class="hint">2枚目から保存されないときは、Chromeが「複数のファイルのダウンロード」を止めています。Chrome右上の︙ → 設定 → サイトの設定 → 自動ダウンロード で、このアプリのサイトを「許可」にしてください。画面の下に「このサイトに複数のファイルのダウンロードを許可しますか？」と出たときは「許可」を押します。</div>
    <div class="card" style="margin-top:16px"><div class="small">利用者：${esc(this.me()||'未接続')}・未送信：${this.queue.length}件<br>アプリ v${APP_VER}・サーバー ${this.state?.serverVer?'v'+esc(this.state.serverVer):'（確認できず）'}${this.lastErr?`<br>最後のエラー：${esc(this.lastErr)}（${esc({offline:'圏外',net:'電波・通信',auth:'招待リンク',server:'サーバー'}[this.errKind]||'')}）`:''}</div></div>
    <button class="btn sec" onclick="App.openManual()">📖 使い方マニュアル${this.state?.manual?.ver?' v'+esc(this.state.manual.ver):''}（PDF）</button>
    <button class="btn sec" onclick="App.exportQueue()">未送信データを書き出す（予備）</button>
    <p class="small">位置図番号は「京都府鳥獣保護区等位置図（令和8年度）」の3桁番号をGPSから計算しています。区画の境界付近では、紙の位置図でも確認してください。</p>`)},
  async saveSettings(){this.cfg={api:$('#cfgApi').value.trim(),token:$('#cfgToken').value.trim()};LS.set('cfg',this.cfg);this.closeSheet();await this.sync(true)},
  async exportQueue(){const q=await DB.all();const blob=new Blob([JSON.stringify(q.map(x=>x.ev),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wanalog_unsent_'+today()+'.json';a.click()}
};

function resizeImage(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let {width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=url})}
